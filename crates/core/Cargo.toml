[package]
name = "tervo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal.workspace = true
portable-pty.workspace = true
tokio.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
# 与 alacritty 相同的宽度表：识别零宽组合字符/ZWJ/变体选择符，按需整帧刷新。
unicode-width.workspace = true
# 双击选词的 UAX#29 词边界。
unicode-segmentation.workspace = true
# iTerm2 IIP（OSC 1337 File）图片解码：PNG 用 png，JPEG 用轻量纯 Rust zune-jpeg。
png = "0.18"
zune-jpeg = "0.5"
# Kitty graphics `o=z` zlib 解压（纯 Rust miniz_oxide 后端）。
flate2 = "1"

[dev-dependencies]
criterion.workspace = true
env_logger.workspace = true

[[bench]]
name = "pty_throughput"
harness = false

# TERM-001：自带的 VT 兼容套件（vttest/esctest 风格），自定义 harness 以便
# 输出 PASS/FAIL/XFAIL 清单。`cargo test -p tervo-core --test vt_compat_suite`。
[[test]]
name = "vt_compat_suite"
harness = false
