[package]
name = "tervo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tervo"
path = "src/main.rs"

[dependencies]
tervo-core = { path = "../core" }
tervo-maximize = { path = "../maximize" }
tervo-diagnostics = { path = "../diagnostics" }
# `TERVO_GPU_NATIVE=1` vertical slice: Frame -> Scene -> WGPU glyph atlas.
tervo-scene = { path = "../scene" }
tervo-render-wgpu = { path = "../render-wgpu" }
tervo-graphics = { path = "../graphics" }
slint.workspace = true
log.workspace = true
env_logger.workspace = true
fontdue = "0.9"
bytemuck = "1"
# 彩色 emoji：owned_ttf_parser 封装 ttf-parser 的 Face + 文件所有权（无自引用 unsafe），
# png 解码位图（fontdue 只做轮廓）。版本与 slint 传递依赖一致，避免重复编译。
owned_ttf_parser = "0.25"
png = "0.18"
crossbeam-channel.workspace = true
serde.workspace = true
toml.workspace = true
# 现成主题导入：iTerm2 plist / Windows Terminal JSON
roxmltree = "0.21"
serde_json = "1"
arboard = "3"
x11rb = { version = "0.14", features = ["xtest", "damage", "shape", "randr"] }
# 仅用于给 gsettings monitor 子进程设 PDEATHSIG，避免父进程被 SIGTERM 后留孤儿
libc = "0.2"
serde_yaml = "0.9"
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
base64 = "0.22.1"
# Feedback bundles: bounded, redacted tar.gz.
tar = "0.4"
flate2 = "1"
# WASM 热路径运行时（插件 v3 runtime = "wasm"）；不含 WASI/文件/网络导入。
wasmtime.workspace = true

[build-dependencies]
slint-build = { version = "1.18", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
# 仅测试用：MinimalSoftwareWindow + SwappedBuffers 部分重绘，验证 Slint
# Image item 在 SharedPixelBuffer 原地更新/同指针重新赋值时不会复用旧纹理。
i-slint-renderer-software = "1.18.1"
# GPU spike example 需要 Slint 的 WGPU30 device/queue 与 `Image::try_from(wgpu::Texture)`。
# features 与主 slint 依赖取并集后，正好等于 `crates/render-wgpu` 已验证过的构建。
slint = { workspace = true, features = [
    "unstable-wgpu-30",
] }
# 只在单元/e2e 测试里把示例 WAT 汇编成 .wasm；生产不解析 WAT。
wat.workspace = true
