[package]
name = "tervo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tervo"
path = "src/main.rs"

[dependencies]
tervo-core = { path = "../core" }
slint.workspace = true
log.workspace = true
env_logger.workspace = true
fontdue = "0.9"
bytemuck = "1"
crossbeam-channel.workspace = true
serde.workspace = true
toml.workspace = true
# 现成主题导入：iTerm2 plist / Windows Terminal JSON
roxmltree = "0.21"
serde_json = "1"
arboard = "3"
x11rb = { version = "0.14", features = ["xtest", "damage"] }
# 仅用于给 gsettings monitor 子进程设 PDEATHSIG，避免父进程被 SIGTERM 后留孤儿
libc = "0.2"

[build-dependencies]
slint-build = { version = "1.18", default-features = false, features = ["compat-1-18"] }
