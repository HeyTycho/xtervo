name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  docs:
    name: Docs links and counts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Markdown links
        run: python3 scripts/check_doc_links.py

      - name: Check documentation counts
        run: python3 scripts/check_docs_counts.py

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build python3 \
            ca-certificates curl libudev-dev openssh-client \
            fonts-dejavu-core fonts-noto-cjk \
            libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Test terminal core
        run: cargo test -p xtervo-core

      - name: Test application
        run: |
          set +e
          # runner 只有 2-4 核，SSH/PTY 集成测试并行时容易端口/超时竞态；
          # 串行跑仍只需几十秒，换取稳定。
          cargo test -p xtervo-app --bin xtervo -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/app-test.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            summary=$(grep -E '^failures:|^    [A-Za-z0-9_:]+$|panicked at|test result:' "$RUNNER_TEMP/app-test.log" | head -40 | tr '\n' ' ' | cut -c1-900)
            {
              echo "### app tests failed (rc=$rc)"
              echo '```'
              grep -E '^failures:|^    [A-Za-z0-9_:]+$|panicked at|test result:' "$RUNNER_TEMP/app-test.log" | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=app tests failed::$summary"
          fi
          exit "$rc"
