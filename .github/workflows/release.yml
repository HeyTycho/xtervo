name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build python3 dpkg-dev binutils \
            libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build and package
        # scripts/package.sh 默认把 CARGO_HOME 指到仓库内；显式使用
        # runner 的 ~/.cargo，复用 rust-cache 缓存，并保持 checkout 干净。
        run: CARGO_HOME="$HOME/.cargo" ./scripts/package.sh dist

      - name: Verify artifacts and checksums
        run: |
          set -euo pipefail
          test -f dist/SHA256SUMS
          ls -lh dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
