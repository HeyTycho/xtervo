name: 功能许愿
description: 描述你遇到的问题、使用场景和期望行为
title: "[Wish] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        “许愿”不需要写成完整方案。把**问题、场景、期望**说清楚，比列一长串功能更有用。
        请先搜索现有 issue；如果只是使用问题，优先查看 README 与文档。

  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 现在哪里不顺手？是缺失能力、操作太绕，还是现有行为不符合预期？
      placeholder: "每次 ... 都要 ...，很打断节奏。"
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么工作流里遇到它？多久一次？有没有真实例子？
      placeholder: "我每天用 xtervo 连 ...，通常先 ... 再 ...。"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你希望 xtervo 怎么做？如果有交互草图、快捷键或配置示例，也可以贴。
      placeholder: "希望可以用 ... 完成 ...，结果是 ...。"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 你现在怎么绕过？有没有其他终端/工具的做法值得参考？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围（可选）
      options:
        - 终端核心 / VT 兼容
        - 渲染 / 性能 / 内存
        - 输入 / 快捷键 / IME
        - 标签页 / 分屏 / 工作区
        - SSH / SFTP / 串口 / Vault
        - 插件 / MCP / AI
        - 文档 / 打包 / 其他
        - 不确定
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，未发现重复。
          required: true
        - label: 我描述的是问题与场景，而不只是“照着某终端做”。
          required: true
