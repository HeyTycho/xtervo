[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/graphics",
    "crates/scene",
    "crates/render",
    "crates/render-wgpu",
    "crates/diagnostics",
    "crates/maximize",
    # Spike only: single-process multi-window feasibility (not shipped in tervo).
    "crates/mw-spike",
]

[workspace.package]
version = "0.4.0-rc.2"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
alacritty_terminal = "0.26"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
# unstable-winit-030 只用于 `WinitWindowAccessor`：无边框自绘拖边时调用
# `winit::Window::drag_resize_window`，让 winit 在它自己的 X11 连接上先
# XUngrabPointer 再发 `_NET_WM_MOVERESIZE`（跨连接的 ungrab 会被 X server 忽略）。
slint = { version = "=1.18.1", default-features = false, features = ["std", "log", "backend-winit", "renderer-skia", "renderer-skia-opengl", "renderer-software", "unstable-wgpu-30", "compat-1-18", "unstable-winit-030"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
# 与 alacritty 相同的 Unicode 宽度表：组合字符/emoji 宽度与零宽判定。
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
log = "0.4"
env_logger = "0.11"
criterion = { version = "0.8", features = ["html_reports"] }
# 插件 v3 WASM 热路径：只启用 JIT/运行时最小 feature；WAT 仅测试/示例编译用。
wasmtime = { version = "34.0.2", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = "1"

# 性能剖面：release 也保留符号，供 perf/flamegraph 使用
[profile.release]
debug = 1
lto = "thin"

# 基准/压测专用：最优代码生成
[profile.bench]
inherits = "release"
debug = 2
lto = "fat"
codegen-units = 1
