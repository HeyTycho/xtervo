site_name: xtervo
site_description: A fast, light native terminal for Linux, written in Rust + Slint.
site_url: https://heytycho.github.io/xtervo/en/
repo_url: https://github.com/HeyTycho/xtervo
repo_name: HeyTycho/xtervo
edit_uri: edit/main/docs/en/
docs_dir: docs/en
site_dir: site/en
use_directory_urls: true

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: images/icon.png
  favicon: images/icon.png
  font: false
  palette:
    - scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Shortcuts: shortcuts.md
      - Known limitations: known-limitations.md
  - Terminal:
      - Behavior: terminal-behavior.md
      - Menu and find: terminal-menu-find.md
      - UI basics: terminal-ui-basics.md
      - Themes: themes.md
  - Connections:
      - SSH / SFTP: ssh-sftp.md
      - Vault: vault.md
      - MCP: mcp.md
  - Plugins:
      - Plugins: plugins.md
      - Plugin API v3: plugin-api-v3.md
  - Help:
      - Diagnostics: diagnostics.md
      - Logging: logging.md
      - FAQ: faq.md

extra:
  alternate:
    - name: 简体中文
      link: https://heytycho.github.io/xtervo/
      lang: zh
    - name: English
      link: https://heytycho.github.io/xtervo/en/
      lang: en

copyright: GPL-3.0-only · xtervo contributors
