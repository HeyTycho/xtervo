# LEGACY（Plugin API v2）：当前宿主只加载 api = 3 / host_abi = 3 的清单，
# 本示例不会被加载或执行，仅作历史参考。可运行的 v3 示例见 ../plugin-v3-echo/。
#
# xtervo AI Chat 参考插件（API v2）。
#
# 安装：把整个 ai-echo/ 目录复制到 ~/.config/xtervo/plugins/ai-echo/，
# 然后重启 xtervo。插件不需要 API Key，也不会访问网络；它是确定性测试目标。
id = "dev.xtervo.ai-echo"
name = "ai-echo"
version = "1.0.0"
api = 2
runtime = "process"
entry = "plugin.py"
description = "Deterministic local AI echo for the xtervo AI panel (no network, no API key)"

[permissions]
# 仅声明/展示；宿主当前仍以普通用户进程运行插件，没有沙箱。
filesystem = "none"
network = false
process = false
clipboard = false
credentials = "none"

[contributes]
commands = ["ping"]

[contributes.ai]
id = "dev.xtervo.ai-echo"
name = "AI Echo"
model = "echo-1"
description = "Replies with a deterministic echo of the last user message; no API key or network."

[[commands]]
id = "ping"
title = "AI Echo: Ping"
